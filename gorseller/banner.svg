<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Stok Kontrol: stok, satış ve kasa tek ekranda">
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
    .baslik { font-size: 68px; font-weight: 800; fill: #0f172a; letter-spacing: -2px; }
    .vurgu { fill: #166534; }
    .soz { font-size: 30px; font-weight: 700; opacity: 0; animation: gec 15s infinite; }
    .s1 { fill: #166534; }
    .s2 { fill: #1d4ed8; animation-delay: 3s; }
    .s3 { fill: #c2410c; animation-delay: 6s; }
    .s4 { fill: #6d28d9; animation-delay: 9s; }
    .s5 { fill: #0e7490; animation-delay: 12s; }
    @keyframes gec {
      0% { opacity: 0; transform: translateY(14px); }
      4%, 17% { opacity: 1; transform: translateY(0); }
      21%, 100% { opacity: 0; transform: translateY(-14px); }
    }
    .serit { animation: kay 15s linear infinite; }
    @keyframes kay { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .soz, .serit { animation: none; }
      .s1 { opacity: 1; }
    }
  </style>
  <rect width="1200" height="300" rx="18" fill="#e3f4e8"/>
  <text x="600" y="128" class="baslik">Her şey <tspan class="vurgu">tek ekranda.</tspan></text>
  <text x="600" y="196" class="soz s1">Barkodla saniyeler içinde satış</text>
  <text x="600" y="196" class="soz s2">Anlık stok ve depo takibi</text>
  <text x="600" y="196" class="soz s3">Son kullanma tarihi uyarıları</text>
  <text x="600" y="196" class="soz s4">Yapay zekâ asistanı Zaanos</text>
  <text x="600" y="196" class="soz s5">Kasa, veresiye ve gelir-gider</text>
  <rect x="450" y="238" width="300" height="6" rx="3" fill="#bfe3c9"/>
  <rect x="450" y="238" width="300" height="6" rx="3" fill="#166534" class="serit" style="transform-origin: 450px 241px"/>
</svg>
